name: moth-tracker
version: 1                         # plugin SCHEMA version — always 1
description: "Fade extreme funding on Hyperliquid outcome markets. Enter opposite the crowded side, collect the funding stream, hard-exit before resolution."

strategy:
  wallet: "${MOTH_WALLET}"
  slots: 3                         # max 3 concurrent outcome positions
  margin_pct: 20                   # 20% of budget per slot
  enabled: true

notifications:
  telegram_chat_id: "${TELEGRAM_CHAT_ID}"

scanners:
  - name: position_tracker         # REQUIRED for DSL exit management — leave verbatim
    type: position_tracker
    interval: 10s

  - name: moth_signals             # MUST match SCANNER_NAME in moth-producer.py
    type: external_scanner         # push-driven — producer POSTs signals, no interval
    outputs: { signals: true, context: false }
    config:
      fields:
        # All keys here must match data={} keys emitted by moth-producer.py
        funding_annualized_pct: { type: number, required: true }
        persistent_hours:       { type: number, required: true }
        mark_px:                { type: number, required: true }
        oi_usd:                 { type: number, required: true }
        hours_to_expiry:        { type: number, required: true }   # -1.0 = unknown
        leverage_used:          { type: number, required: true }

actions:
  - name: moth_entry
    action_type: OPEN_POSITION
    decision_mode: llm
    decision_model: ${MOTH_DECISION_MODEL}   # bare model name, no provider prefix
    scanners: [moth_signals]
    min_confidence: 7
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 20        # outcome markets can be illiquid — give 20s
      leverage: 2                            # hard 2x cap — binary resolution risk
    context:
      - { type: signal, scanner: moth_signals }
    decision_prompt: |
      You are evaluating a funding fade signal on a Hyperliquid OUTCOME (prediction) market.
      These markets resolve to 0 or 1 — the single greatest risk is holding through expiry
      on the wrong side. Approve ONLY if ALL of the following are true:

      1. funding_annualized_pct >= 50  (extreme crowding, not noise)
      2. persistent_hours >= 6         (sustained, not a spike)
      3. mark_px between 0.08 and 0.92 (not already resolving)
      4. oi_usd >= 100000              (enough liquidity to exit)
      5. hours_to_expiry > 24 OR hours_to_expiry == -1.0  (-1 means unknown, allow with caution)

      If ANY condition fails, return confidence 0 and explain why.

      Signal data:
      {{signal_moth_signals}}

exit:
  engine: dsl
  interval_seconds: 30
  dsl_preset:
    # mean_reversion — tight, fast snapback, time-cuts on. Correct for funding fades.
    hard_timeout: { enabled: true, interval_in_minutes: 2880 }       # 48h max hold
    weak_peak_cut: { enabled: true, interval_in_minutes: 120, min_value: 2.0 }
    phase1: { enabled: true, max_loss_pct: 15.0, retrace_threshold: 6, consecutive_breaches_required: 1 }
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 5,  lock_hw_pct: 30 }   # at +5% ROE, lock 30% of high-water
        - { trigger_pct: 10, lock_hw_pct: 50 }   # at +10%, lock 50%
        - { trigger_pct: 15, lock_hw_pct: 65 }   # at +15%, lock 65%
        - { trigger_pct: 25, lock_hw_pct: 80 }   # at +25%, lock 80%
        - { trigger_pct: 40, lock_hw_pct: 90 }   # at +40%, lock 90%

risk:
  guard_rails:
    daily_loss_limit_pct: 5           # outcome markets can gap — tighter than default
    max_entries_per_day: 4            # conservative — outcome positions are patient holds
    max_consecutive_losses: 2         # 2 bad reads = pause and reassess
    cooldown_minutes: 120             # 2h cooldown after consecutive losses
    drawdown_halt_pct: 15             # halt if 15% drawdown on the strategy budget
    per_asset_cooldown_minutes: 360   # 6h cooldown per ticker after a loss
